<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Bonus Comparison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #e94560;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .table-wrapper {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(233, 69, 96, 0.7);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 15px;
            font-size: 0.9rem;
        }

        td:first-child {
            font-weight: 600;
            color: #feca57;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #feca57;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e94560;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .table-wrapper {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }

            th, td {
                padding: 10px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3rem;
            }

            th, td {
                padding: 8px 6px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Casino Bonus Comparison</h1>
        <div class="table-wrapper">
            <div id="loading" class="loading">Loading bonus data...</div>
            <div id="error" class="error" style="display: none;"></div>
            <table id="bonusTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Casino Name</th>
                        <th>Welcome Bonus</th>
                        <th>Wagering Requirement</th>
                        <th>Minimum Deposit</th>
                        <th>Source</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('./data.json');
                if (!response.ok) {
                    throw new Error(`Failed to load data: ${response.statusText}`);
                }
                const data = await response.json();
                displayData(data);
            } catch (err) {
                console.error('Error loading data:', err);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 
                    'Error loading bonus data. Please ensure data.json exists and is valid.';
            }
        }

        function displayData(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            data.forEach(casino => {
                const row = document.createElement('tr');
                
                const casinoCell = document.createElement('td');
                casinoCell.textContent = casino.casino_name;
                
                const bonusCell = document.createElement('td');
                bonusCell.textContent = casino.welcome_bonus;
                
                const wageringCell = document.createElement('td');
                wageringCell.textContent = `${casino.wagering_requirement}x`;
                
                const depositCell = document.createElement('td');
                depositCell.textContent = casino.minimum_deposit;
                
                const sourceCell = document.createElement('td');
                const sourceLink = document.createElement('a');
                sourceLink.href = casino.source_url;
                sourceLink.textContent = 'View Source';
                sourceLink.target = '_blank';
                sourceLink.rel = 'noopener noreferrer';
                sourceLink.style.color = '#feca57';
                sourceLink.style.textDecoration = 'none';
                sourceCell.appendChild(sourceLink);
                
                row.appendChild(casinoCell);
                row.appendChild(bonusCell);
                row.appendChild(wageringCell);
                row.appendChild(depositCell);
                row.appendChild(sourceCell);
                
                tableBody.appendChild(row);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('bonusTable').style.display = 'table';
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
